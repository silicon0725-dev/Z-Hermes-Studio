name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -c Release
      # e2e 测试无 ZHS_E2E=1 与 /opt/ZCode 时自动跳过，CI 只跑单元测试
      - run: dotnet test -v q --no-build -c Release

  publish-linux:
    name: publish linux-x64 (self-contained)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish src/ZHS.Desktop -c Release -r linux-x64 --self-contained -o publish/linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ZHS.Desktop-linux-x64
          path: publish/linux-x64
